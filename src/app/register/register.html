<div class="min-h-screen bg-gray-900 flex flex-col items-center justify-center gap-5">
  <h1 class="text-7xl font-bold bg-gradient-to-r from-emerald-400 via-cyan-500 to-purple-600 bg-clip-text text-transparent mb-8 text-center drop-shadow-lg pb-2">Bienvenue sur Tame The Fox</h1>
  <div class="w-full max-w-lg">
    <h2
      class="text-5xl font-bold text-slate-300 mb-8 text-center drop-shadow-lg pb-2">
      Quel est votre mood ?</h2>
    <div class="flex flex-col gap-8">
      <button type="button" (click)="chooseEmoji('☀️')"
              class="w-full py-5 bg-gradient-to-r from-emerald-500 via-cyan-500 to-purple-600 text-white text-2xl font-bold rounded-lg hover:from-emerald-600 hover:via-cyan-600 hover:to-purple-700 transition-all duration-200 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 focus:ring-offset-slate-900 cursor-pointer">
        ☀️ Sunny
      </button>
      <button type="button" (click)="chooseEmoji('☁️')"
              class="w-full py-5 bg-gradient-to-r from-emerald-500 via-cyan-500 to-purple-600 text-white text-2xl font-bold rounded-lg hover:from-emerald-600 hover:via-cyan-600 hover:to-purple-700 transition-all duration-200 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 focus:ring-offset-slate-900 cursor-pointer">
        ☁️ Cloud
      </button>
      <button type="button" (click)="chooseEmoji('❓')"
              class="w-full py-5 bg-gradient-to-r from-emerald-500 via-cyan-500 to-purple-600 text-white text-2xl font-bold rounded-lg hover:from-emerald-600 hover:via-cyan-600 hover:to-purple-700 transition-all duration-200 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:ring-offset-2 focus:ring-offset-slate-900 cursor-pointer">
        ❓ Question
      </button>
    </div>
  </div>
</div>
